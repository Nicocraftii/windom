<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Windom</title>
  <link rel="icon" type="image/x-icon" href="./icon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.css">
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <div id="map"></div>
  <div id="loading-overlay" style="display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(14,22,36,0.6); backdrop-filter: blur(4px); flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: bold; transition: opacity 0.3s;">
  <div class="spinner"></div>
  <div data-i18n="load" style="margin-top: 15px;">Chargement…</div>
  </div>

  <section id="hud" class="panel">
    <div class="row head">
      <span id="dot" class="dot loading" title=""></span>
      <strong>Windom</strong>
      <span class="model">AROME Indien 2.5km</span>
      <button id="collapse" class="icon" aria-label="Toggle">▾</button>
    </div>
    <div class="body">
      <div class="meta"><span data-i18n="updated">Mis à jour</span> <b id="last">–</b> · <span data-i18n="next">Prochaine</span> <b id="next">–</b></div>
      <div id="dates" class="seg"></div>
      <div id="hours" class="cells"></div>
    </div>
  </section>

  <div id="controls" class="panel">
    <button id="lang">EN</button>
    <button id="kind" data-i18n="wind">Vent</button>
  </div>

  <div id="legend" class="panel"></div>
  <div id="cursor" class="panel">–</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
